name: Deploy Storybook to GitHub Pages

# develop 브랜치 푸시 시 storybook 자동 배포
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "storybook-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 맥(M1/M2) 개발 환경에 맞춘 Tailwind 네이티브 바이너리를
      # CI(Linux)에서도 설치 가능하게 platform/arch를 강제로 맞춤
      - name: Install dependencies
        working-directory: deepong
        run: npm install --platform=darwin --arch=arm64

      - name: Build Storybook
        working-directory: deepong
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 레포 루트 기준: deepong/storybook-static
          path: "deepong/storybook-static"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
