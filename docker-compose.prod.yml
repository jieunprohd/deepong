# 운영용 Compose. VM에서 git pull 후 다음으로 기동:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 구성:
#  - caddy  : 리버스 프록시 + 자동 HTTPS (포트 80, 443)
#  - api    : NestJS @deepong/api (내부 포트 4000, 외부 비공개)
#  - mysql  : MySQL 8.0 (내부, 외부 비공개)
#  - redis  : Redis 7 (내부, 외부 비공개)
#
# 외부에 노출되는 건 caddy(80, 443)뿐. api/mysql/redis는 docker network 내부에서만 접근.
# DOMAIN 환경변수가 있으면 자동 HTTPS, 없으면 :80 HTTP 프록시만.

name: deepong-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: deepong-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - deepong

  api:
    build:
      context: ./deepong
      dockerfile: apps/api/Dockerfile
    image: deepong-api:latest
    container_name: deepong-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      # DB
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Auth (JWT)
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      # Google OAuth
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_PASSWORD: ${OAUTH_CLIENT_PASSWORD:-}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-}
      # Kakao OAuth
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CALLBACK_URL: ${KAKAO_CALLBACK_URL:-}
      # 프론트 CORS
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
    # api는 caddy로만 접근 — 외부 ports 노출 안 함
    networks:
      - deepong

  mysql:
    image: mysql:8.0
    container_name: deepong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - deepong

  redis:
    image: redis:7-alpine
    container_name: deepong-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - deepong

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  deepong:
    driver: bridge
