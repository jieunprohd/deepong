<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 로그인 · 딥워크</title><link rel="stylesheet" href="tokens.css">
<style>
body { background: var(--gray-100); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
.window { width: 960px; height: 640px; background: white; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; }
.back-link { position: fixed; top: 20px; left: 20px; font-size: 13px; color: var(--gray-600); padding: 8px 14px; background: white; border-radius: var(--r-full); box-shadow: var(--shadow-sm); }
.content { flex: 1; display: flex; }
.left { flex: 1; background: linear-gradient(155deg, #2F6BFF 0%, #1F4FD9 100%); padding: 56px 48px; color: white; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.left::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,0.05); }
.left::after { content: ''; position: absolute; bottom: -80px; left: -40px; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,0.04); }
.brand-mark { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; opacity: 0.85; position: relative; }
.brand-mark .dot { display: inline-block; width: 8px; height: 8px; background: white; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.tagline { position: relative; }
.tagline h2 { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; margin-bottom: 16px; }
.tagline p { font-size: 16px; line-height: 1.6; opacity: 0.85; }
.feature-card { position: relative; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 18px 20px; border-radius: var(--r-md); border: 1px solid rgba(255,255,255,0.14); }
.feature-card .label { font-size: 11px; font-weight: 600; opacity: 0.7; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.feature-card .value { font-size: 14px; line-height: 1.5; }

.right { width: 440px; padding: 72px 56px; display: flex; flex-direction: column; justify-content: center; }
.title-row { margin-bottom: 40px; }
.title-row h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 8px; }
.title-row p { color: var(--gray-600); font-size: 14px; }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
.field input { width: 100%; height: 48px; padding: 0 16px; border: 1px solid var(--gray-200); border-radius: var(--r-md); font-size: 15px; }
.field input:focus { outline: none; border-color: var(--brand-primary); }
.field-help { font-size: 12px; color: var(--gray-500); margin-top: 6px; }
.submit { width: 100%; height: 52px; background: var(--brand-primary); color: white; border-radius: var(--r-md); font-size: 15px; font-weight: 600; margin-top: 10px; }
.submit:hover { background: var(--brand-primary-hover); }
.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--gray-400); font-size: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
.oauth-row { display: flex; flex-direction: column; gap: 8px; }
.oauth-btn { height: 48px; border: 1px solid var(--gray-200); border-radius: var(--r-md); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; background: white; color: var(--gray-800); }
.oauth-btn:hover { background: var(--gray-50); }
.oauth-btn.kakao { background: #FEE500; border-color: #FEE500; color: #181600; }
.oauth-btn.kakao:hover { background: #F6D900; }
.footer-link { text-align: center; margin-top: 24px; font-size: 13px; color: var(--gray-600); }
.footer-link a { color: var(--brand-primary); font-weight: 600; }
.tab-row { display: flex; gap: 4px; background: var(--gray-100); padding: 4px; border-radius: var(--r-md); margin-bottom: 28px; }
.tab { flex: 1; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; color: var(--gray-600); cursor: pointer; transition: all var(--t-fast); }
.tab.active { background: white; color: var(--gray-900); box-shadow: var(--shadow-xs); }
</style></head>
<body>
<a href="index.html" class="back-link">← 전체 화면</a>
<div class="window">
  <div class="window-chrome"><div class="window-controls"><button class="window-btn close"></button><button class="window-btn min"></button><button class="window-btn max"></button></div></div>
  <div class="content">
    <div class="left">
      <div class="brand-mark"><span class="dot"></span>딥워크</div>
      <div class="tagline">
        <h2>알림이 나를<br>방해하지 않는<br>메신저</h2>
        <p>메시지는 언제든, 알림은 적절할 때.<br>집중과 연결이 공존하는 공간.</p>
      </div>
      <div class="feature-card">
        <div class="label">DEEPWORK 원칙</div>
        <div class="value">친구가 집중 중일 때, 수다는 조용히 기다립니다. 급할 때만 알림이 갑니다.</div>
      </div>
    </div>
    <div class="right">
      <div class="title-row"><h1>다시 만나서 반가워요</h1><p>이메일로 이어가거나 소셜 계정으로 시작하세요</p></div>
      <div class="tab-row"><div class="tab active">로그인</div><div class="tab">회원가입</div></div>
      <div class="field"><label class="field-label">이메일</label><input type="email" placeholder="you@example.com" value="oscar@lane4.kr"></div>
      <div class="field"><label class="field-label">비밀번호</label><input type="password" placeholder="••••••••"><div class="field-help">비밀번호를 잊으셨나요? <a href="#" style="color:var(--brand-primary);font-weight:600">재설정</a></div></div>
      <button class="submit">로그인</button>
      <div class="divider">또는</div>
      <div class="oauth-row">
        <button class="oauth-btn kakao">카카오로 계속하기</button>
        <button class="oauth-btn">Google로 계속하기</button>
      </div>
      <div class="footer-link">아직 계정이 없나요? <a href="#">가입하기</a></div>
    </div>
  </div>
</div>
</body></html>
