<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>02 온보딩 · 디퐁</title><link rel="stylesheet" href="tokens.css">
<style>
body { background: var(--gray-100); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
.back-link { position: fixed; top: 20px; left: 20px; font-size: 13px; color: var(--gray-600); padding: 8px 14px; background: white; border-radius: var(--r-full); box-shadow: var(--shadow-sm); z-index: 10; }
.window { width: 720px; height: 720px; background: white; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; }
.progress-bar { height: 3px; background: var(--gray-100); }
.progress-fill { height: 100%; background: var(--brand-primary); width: 66%; transition: width var(--t-slow); }
.body { flex: 1; padding: 48px 72px; overflow-y: auto; }
.step-label { font-size: 11px; font-weight: 700; color: var(--brand-primary); letter-spacing: 0.08em; margin-bottom: 8px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 8px; }
.page-desc { color: var(--gray-600); font-size: 14px; margin-bottom: 32px; }

.profile-upload { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px dashed var(--gray-300); border-radius: var(--r-md); margin-bottom: 24px; }
.avatar-large { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #2F6BFF, #85B7EB); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 700; }
.upload-text { flex: 1; }
.upload-text h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.upload-text p { font-size: 12px; color: var(--gray-500); }
.upload-btn { height: 36px; padding: 0 14px; border-radius: var(--r-sm); background: var(--gray-100); font-size: 13px; font-weight: 500; }

.field { margin-bottom: 18px; }
.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
.field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--gray-200); border-radius: var(--r-md); font-size: 15px; }
.field input:focus { outline: none; border-color: var(--brand-primary); }

.section-divider { margin: 32px 0 24px; display: flex; align-items: center; gap: 12px; }
.section-divider-line { flex: 1; height: 1px; background: var(--gray-200); }
.section-divider h3 { font-size: 13px; font-weight: 600; color: var(--gray-500); }

.time-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.time-row .day { width: 40px; height: 36px; border-radius: var(--r-sm); background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--gray-600); }
.time-row .day.active { background: var(--brand-primary-light); color: var(--brand-primary); }
.time-input { flex: 1; display: flex; gap: 8px; align-items: center; }
.time-input input { flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--gray-200); border-radius: var(--r-sm); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
.time-input .dash { color: var(--gray-400); }

.day-row { display: flex; gap: 4px; margin-bottom: 18px; }
.day-btn { flex: 1; height: 40px; border: 1px solid var(--gray-200); border-radius: var(--r-sm); font-size: 13px; font-weight: 600; background: white; color: var(--gray-600); cursor: pointer; transition: all var(--t-fast); }
.day-btn.active { background: var(--brand-primary); color: white; border-color: var(--brand-primary); }
.day-btn.weekend { color: var(--gray-400); }

.footer-bar { padding: 16px 72px; border-top: 1px solid var(--gray-100); display: flex; justify-content: space-between; align-items: center; }
.prev { color: var(--gray-600); font-size: 14px; font-weight: 500; padding: 10px 14px; border-radius: var(--r-sm); }
.prev:hover { background: var(--gray-50); }
.next { height: 44px; padding: 0 24px; background: var(--brand-primary); color: white; border-radius: var(--r-md); font-size: 14px; font-weight: 600; }
.next:hover { background: var(--brand-primary-hover); }

.tz-select { position: relative; }
.tz-select select { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--gray-200); border-radius: var(--r-md); font-size: 15px; background: white; appearance: none; -webkit-appearance: none; cursor: pointer; }
.tz-select::after { content: ''; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-right: 1.5px solid var(--gray-500); border-bottom: 1.5px solid var(--gray-500); transform: translateY(-65%) rotate(45deg); pointer-events: none; }
</style></head>
<body>
<a href="index.html" class="back-link">← 전체 화면</a>
<div class="window">
  <div class="window-chrome"><div class="window-controls"><button class="window-btn close"></button><button class="window-btn min"></button><button class="window-btn max"></button></div></div>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div class="body">
    <div class="step-label">STEP 2 / 3</div>
    <h1 class="page-title">프로필과 업무 시간을 알려주세요</h1>
    <p class="page-desc">친구들에게 보이는 모습이고, 알림을 언제 보낼지 결정하는 기준이 됩니다.</p>

    <div class="profile-upload">
      <div class="avatar-large">O</div>
      <div class="upload-text"><h4>Oscar</h4><p>프로필 사진을 설정하면 친구들이 더 쉽게 알아봐요.</p></div>
      <button class="upload-btn">업로드</button>
    </div>

    <div class="field"><label class="field-label">닉네임</label><input type="text" value="Oscar"></div>
    <div class="field"><label class="field-label">한 줄 소개 (선택)</label><input type="text" placeholder="친구들에게 보일 짧은 소개"></div>
    <div class="field">
      <label class="field-label">시간대</label>
      <div class="tz-select"><select><option>대한민국 표준시 (KST, UTC+9)</option><option>일본 표준시 (JST, UTC+9)</option><option>태평양 표준시 (PST, UTC-8)</option></select></div>
    </div>

    <div class="section-divider"><div class="section-divider-line"></div><h3>업무 시간</h3><div class="section-divider-line"></div></div>
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:16px">이 시간에는 "일하는 중" 상태가 되고, 수다 메시지 알림은 쉬는 시간에 묶어서 도착해요.</p>

    <div class="day-row">
      <button class="day-btn">월</button>
      <button class="day-btn active">화</button>
      <button class="day-btn active">수</button>
      <button class="day-btn active">목</button>
      <button class="day-btn active">금</button>
      <button class="day-btn weekend">토</button>
      <button class="day-btn weekend">일</button>
    </div>

    <div class="time-row">
      <div class="day active">평일</div>
      <div class="time-input"><input type="text" value="09:30"><span class="dash">–</span><input type="text" value="18:30"></div>
    </div>
    <div class="time-row">
      <div class="day">주말</div>
      <div class="time-input"><input type="text" value="설정 안 함" style="color:var(--gray-400)" disabled></div>
    </div>
  </div>
  <div class="footer-bar">
    <button class="prev">← 이전</button>
    <button class="next">다음으로</button>
  </div>
</div>
</body></html>
