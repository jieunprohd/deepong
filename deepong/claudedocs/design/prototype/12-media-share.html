<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>12 미디어 공유 · 디퐁</title><link rel="stylesheet" href="tokens.css">
<style>
body { background: var(--gray-100); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.back-link { position: fixed; top: 20px; left: 20px; font-size: 13px; color: var(--gray-600); padding: 8px 14px; background: white; border-radius: var(--r-full); box-shadow: var(--shadow-sm); z-index: 10; }
.window { width: 1100px; height: 760px; background: white; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; }
.app { flex: 1; display: flex; }

.sidebar { width: 72px; background: var(--gray-50); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px; }
.nav-icon { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; color: var(--gray-500); }
.nav-icon.active { background: var(--brand-primary-light); color: var(--brand-primary); }
.sidebar .spacer { flex: 1; }
.me-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #2F6BFF, #85B7EB); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }

.main { flex: 1; display: flex; flex-direction: column; background: var(--gray-50); }
.room-header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: white; border-bottom: 1px solid var(--gray-200); }
.room-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #FFB26B, #F59E0B); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
.room-name { font-size: 15px; font-weight: 700; }
.room-status { font-size: 12px; color: var(--gray-600); }

.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.msg-group { display: flex; gap: 10px; max-width: 72%; }
.msg-group.mine { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #FFB26B, #F59E0B); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.msg-avatar.hide { visibility: hidden; }
.msg-stack { display: flex; flex-direction: column; gap: 6px; }
.msg-group.mine .msg-stack { align-items: flex-end; }
.msg-meta { display: flex; gap: 6px; font-size: 11px; color: var(--gray-500); padding: 0 4px; }
.sender { font-weight: 600; color: var(--gray-700); font-size: 12px; }

/* Image grid */
.img-grid { display: grid; grid-template-columns: 160px 160px; gap: 4px; border-radius: var(--r-md); overflow: hidden; max-width: 324px; }
.img-item { aspect-ratio: 1; position: relative; cursor: pointer; overflow: hidden; }
.img-1 { background: linear-gradient(135deg, #E8D5B5, #C9A875); }
.img-2 { background: linear-gradient(135deg, #B5D4E8, #7FA8C9); }
.img-3 { background: linear-gradient(135deg, #C9D4B5, #8FA875); }
.img-4 { background: linear-gradient(135deg, #E8B5C9, #C97F9F); position: relative; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: 700; }
.img-4::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.img-4 span { position: relative; z-index: 1; }
.img-item::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.1)); }

/* Large OG link preview */
.og-large { max-width: 420px; background: white; border: 1px solid var(--gray-200); border-radius: var(--r-md); overflow: hidden; cursor: pointer; transition: all var(--t-fast); }
.og-large:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-sm); }
.og-large .hero { height: 200px; background: linear-gradient(135deg, #FFE4C7 0%, #FFB26B 60%, #F59E0B 100%); position: relative; display: flex; align-items: end; padding: 16px; }
.og-large .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.25), transparent 50%); }
.og-large .hero-title { color: white; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; }
.og-large .info { padding: 12px 16px; }
.og-large .title { font-size: 14px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
.og-large .desc { font-size: 12px; color: var(--gray-600); line-height: 1.5; margin-bottom: 8px; }
.og-large .domain { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray-500); }
.og-large .domain .favicon { width: 14px; height: 14px; border-radius: 3px; background: var(--gray-900); }

.bubble { padding: 10px 14px; border-radius: var(--r-md); font-size: 14px; line-height: 1.45; }
.bubble.theirs { background: white; border: 1px solid var(--gray-200); color: var(--gray-900); }
.bubble-tag { font-size: 10px; font-weight: 700; opacity: 0.7; margin-bottom: 4px; }

/* Upload preview panel */
.upload-panel { background: white; border-top: 1px solid var(--gray-200); padding: 14px 20px; }
.upload-preview-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.up-item { width: 72px; height: 72px; border-radius: var(--r-sm); position: relative; overflow: hidden; }
.up-item.img1 { background: linear-gradient(135deg, #E8D5B5, #C9A875); }
.up-item.img2 { background: linear-gradient(135deg, #B5D4E8, #7FA8C9); }
.up-item .remove { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
.up-item.add { background: var(--gray-100); border: 1px dashed var(--gray-300); display: flex; align-items: center; justify-content: center; color: var(--gray-500); cursor: pointer; font-size: 20px; }

.link-preview-small { display: flex; gap: 10px; padding: 8px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--r-sm); margin-bottom: 10px; max-width: 400px; }
.link-thumb-sm { width: 48px; height: 48px; border-radius: var(--r-xs); background: linear-gradient(135deg, #EAF0FF, #B5CEF5); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.link-info-sm { flex: 1; min-width: 0; }
.link-title-sm { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-desc-sm { font-size: 11px; color: var(--gray-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-remove { background: none; border: none; color: var(--gray-500); cursor: pointer; padding: 4px; font-size: 14px; }

.composer-box { display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 14px; background: var(--gray-100); border-radius: var(--r-md); }
.composer-input { flex: 1; min-height: 36px; padding: 8px 0; border: none; background: transparent; resize: none; font-size: 14px; outline: none; font-family: inherit; }
.send-btn { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--brand-primary); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }

.tone-selector { display: flex; gap: 4px; margin-bottom: 8px; }
.tone-btn { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: var(--r-full); font-size: 11px; font-weight: 600; background: var(--gray-100); color: var(--gray-600); border: 1px solid transparent; cursor: pointer; }
.tone-btn.active { background: var(--tone-share-bg); color: #1E5FC0; border-color: #A5C9F5; }

.hint { font-size: 11px; color: var(--gray-500); margin-top: 6px; padding: 0 4px; display: flex; justify-content: space-between; }
</style></head>
<body>
<a href="index.html" class="back-link">← 전체 화면</a>
<div class="window">
  <div class="window-chrome"><div class="window-controls"><button class="window-btn close"></button><button class="window-btn min"></button><button class="window-btn max"></button></div></div>
  <div class="app">
    <div class="sidebar">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l7-7 7 7M6 10v8h10v-8"/></svg></div>
      <div class="nav-icon active"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h16v10H9l-4 3v-3H3z"/></svg></div>
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="7" r="3"/><path d="M5 19c0-3 3-6 6-6s6 3 6 6"/></svg></div>
      <div class="spacer"></div>
      <div class="me-avatar">O</div>
    </div>

    <div class="main">
      <div class="room-header">
        <div class="room-avatar">민</div>
        <div><div class="room-name">민수</div><div class="room-status">🟡 일하는 중</div></div>
      </div>

      <div class="messages">
        <div class="msg-group">
          <div class="msg-avatar">민</div>
          <div class="msg-stack">
            <div class="msg-meta"><span class="sender">민수</span><span>오후 2:15</span></div>
            <div class="bubble theirs">
              <div class="bubble-tag">📎 공유</div>
              주말에 같이 가보자! 예약 필요한 곳이야
            </div>
            <div class="og-large">
              <div class="hero"><div class="hero-title">센터포크 성수점</div></div>
              <div class="info">
                <div class="title">성수 핫플레이스 · 이탈리안 다이닝</div>
                <div class="desc">성수동에 새로 생긴 이탤리안 레스토랑. 시그니처 파스타와 와인 페어링이 유명하며 주말은 2주 전 예약 필수.</div>
                <div class="domain"><div class="favicon"></div>centerfork.kr</div>
              </div>
            </div>
          </div>
        </div>

        <div class="msg-group">
          <div class="msg-avatar">민</div>
          <div class="msg-stack">
            <div class="bubble theirs">
              <div class="bubble-tag">📎 공유</div>
              전에 거기 갔을 때 찍은 사진들이야
            </div>
            <div class="img-grid">
              <div class="img-item img-1"></div>
              <div class="img-item img-2"></div>
              <div class="img-item img-3"></div>
              <div class="img-item img-4"><span>+4</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="upload-panel">
        <div class="tone-selector">
          <button class="tone-btn">💬 수다</button>
          <button class="tone-btn">🤔 물어봄</button>
          <button class="tone-btn">⚡ 급함</button>
          <button class="tone-btn active">📎 공유</button>
        </div>

        <div class="upload-preview-row">
          <div class="up-item img1"><div class="remove">×</div></div>
          <div class="up-item img2"><div class="remove">×</div></div>
          <div class="up-item add">+</div>
        </div>

        <div class="link-preview-small">
          <div class="link-thumb-sm">🍜</div>
          <div class="link-info-sm">
            <div class="link-title-sm">센터포크 성수점 · 네이버 지도</div>
            <div class="link-desc-sm">링크 미리보기가 자동으로 생성되었어요</div>
          </div>
          <button class="link-remove">×</button>
        </div>

        <div class="composer-box">
          <textarea class="composer-input" placeholder="설명 추가 (선택)">여기 파스타 진짜 맛있어 ㅠㅠ 꼭 가보자</textarea>
          <button class="send-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8l12-6-6 12-2-5z"/></svg></button>
        </div>

        <div class="hint">
          <span>📎 공유 메시지는 상대방의 "편하게 볼 것" 섹션으로 들어가요</span>
          <span>2개 파일 · 1.4MB</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
