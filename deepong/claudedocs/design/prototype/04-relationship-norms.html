<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>04 커뮤니케이션 규범 · 디퐁</title><link rel="stylesheet" href="tokens.css">
<style>
body { background: var(--gray-100); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
.back-link { position: fixed; top: 20px; left: 20px; font-size: 13px; color: var(--gray-600); padding: 8px 14px; background: white; border-radius: var(--r-full); box-shadow: var(--shadow-sm); z-index: 10; }
.window { width: 640px; height: 780px; background: white; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; }
.body { flex: 1; padding: 40px 48px; overflow-y: auto; }
.people-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
.avatar-big { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; font-weight: 700; }
.avatar-big.me { background: linear-gradient(135deg, #2F6BFF, #85B7EB); }
.avatar-big.friend { background: linear-gradient(135deg, #FFB26B, #F59E0B); }
.link-ring { display: flex; align-items: center; gap: 4px; }
.link-ring .dot { width: 6px; height: 6px; background: var(--gray-300); border-radius: 50%; }
.link-ring .dot.active { background: var(--brand-primary); }

.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; text-align: center; margin-bottom: 6px; }
.page-desc { color: var(--gray-600); font-size: 14px; text-align: center; margin-bottom: 32px; line-height: 1.5; }

.rule-card { border: 1px solid var(--gray-200); border-radius: var(--r-md); padding: 16px 18px; margin-bottom: 12px; }
.rule-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.rule-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.rule-desc { font-size: 12px; color: var(--gray-600); line-height: 1.5; }

.toggle { position: relative; width: 44px; height: 26px; background: var(--gray-300); border-radius: var(--r-full); cursor: pointer; transition: background var(--t-fast); flex-shrink: 0; }
.toggle.on { background: var(--brand-primary); }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform var(--t-fast); box-shadow: var(--shadow-xs); }
.toggle.on::after { transform: translateX(18px); }

.segmented { display: flex; gap: 4px; background: var(--gray-100); padding: 3px; border-radius: var(--r-sm); }
.seg-btn { flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--gray-600); cursor: pointer; transition: all var(--t-fast); background: none; border: none; }
.seg-btn.active { background: white; color: var(--gray-900); box-shadow: var(--shadow-xs); }

.footer-bar { padding: 16px 48px; border-top: 1px solid var(--gray-100); display: flex; gap: 12px; }
.footer-bar button { flex: 1; height: 48px; border-radius: var(--r-md); font-size: 14px; font-weight: 600; }
.skip { background: var(--gray-100); color: var(--gray-700); }
.skip:hover { background: var(--gray-200); }
.save { background: var(--brand-primary); color: white; }
.save:hover { background: var(--brand-primary-hover); }

.hint-box { display: flex; gap: 10px; padding: 12px 14px; background: var(--brand-primary-subtle); border-radius: var(--r-sm); margin-bottom: 24px; font-size: 12px; color: var(--gray-700); line-height: 1.5; }
.hint-box svg { color: var(--brand-primary); flex-shrink: 0; }
</style></head>
<body>
<a href="index.html" class="back-link">← 전체 화면</a>
<div class="window">
  <div class="window-chrome"><div class="window-controls"><button class="window-btn close"></button><button class="window-btn min"></button><button class="window-btn max"></button></div></div>
  <div class="body">
    <div class="people-row">
      <div class="avatar-big me">O</div>
      <div class="link-ring"><span class="dot active"></span><span class="dot active"></span><span class="dot"></span></div>
      <div class="avatar-big friend">민</div>
    </div>
    <h1 class="page-title">민수와의 소통 규칙</h1>
    <p class="page-desc">처음 친구를 추가할 때 한 번만 설정해요.<br>언제든 나중에 바꿀 수 있어요.</p>

    <div class="hint-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v4m0 2v.5"/></svg>
      <div>이 규칙은 두 사람에게만 적용돼요. 민수에게도 동일한 규칙이 제안되고, 각자 조정할 수 있어요.</div>
    </div>

    <div class="rule-card">
      <div class="rule-head">
        <div>
          <div class="rule-title">업무 시간 공유</div>
          <div class="rule-desc">서로의 바쁜 시간을 알려줘서 방해를 줄여요.</div>
        </div>
        <div class="toggle on"></div>
      </div>
    </div>

    <div class="rule-card">
      <div class="rule-head">
        <div>
          <div class="rule-title">"급함" 태그 허용</div>
          <div class="rule-desc">집중 모드 중에도 알림을 받을 수 있는 태그예요. 남용을 막기 위해 하루 3회로 제한돼요.</div>
        </div>
        <div class="toggle on"></div>
      </div>
    </div>

    <div class="rule-card">
      <div class="rule-head" style="margin-bottom:14px">
        <div>
          <div class="rule-title">기본 메시지 톤</div>
          <div class="rule-desc">메시지 입력창에 자동으로 선택되는 태그예요.</div>
        </div>
      </div>
      <div class="segmented">
        <button class="seg-btn active">💬 수다</button>
        <button class="seg-btn">🤔 물어봄</button>
        <button class="seg-btn">📎 공유</button>
      </div>
    </div>

    <div class="rule-card">
      <div class="rule-head">
        <div>
          <div class="rule-title">읽음 표시 공유</div>
          <div class="rule-desc">내가 읽었는지 민수에게 보여요. "읽씹" 스트레스가 있다면 끄세요.</div>
        </div>
        <div class="toggle"></div>
      </div>
    </div>
  </div>
  <div class="footer-bar">
    <button class="skip">기본값 쓰기</button>
    <button class="save">저장하고 대화 시작</button>
  </div>
</div>
</body></html>
